# Render Blueprint for the jsona share-server (Docker + persistent disk).
#
# Render dashboard -> New -> Blueprint -> connect this repo. Render reads this
# file at the repo root, builds server/Dockerfile, and creates a web service.

services:
  - type: web
    name: jsona-share
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: jsona-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8787
      - key: PUBLIC_URL
        sync: false
      - key: PUBLIC_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BYOK_MASTER_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_ALLOWED_USERS
        sync: false
      - key: PRO_LOGINS
        sync: false
      - key: TEAM_LOGINS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /app/data/share.db
